# github-vuln-watcher values.
#
# APPLICATION chart. Ships ONE GitHub watcher StatefulSet
# (github-vuln-watcher), rendered through the `common` library chart. The
# watcher detects Go vulnerabilities published against unchanged dependencies
# (a repo's CI goes red with no code change), clones each consenting repo, runs
# its own vuln gate (`make vulncheck` + `make check`), and emits github-update-go
# tasks for the update-go agent to fix.
#
# NO AGENT HERE. The consuming agent (assignee github-update-go-agent) already
# ships with the core `agent` chart as Config `agent-github-update-go`. This is
# the deliberate difference from github-pr-reviewer, which bundles both.
#
# PREREQUISITE: install the core `agent` chart FIRST — it owns the
# configs.agent.benjamin-borbe.de CRD, the task controller, the executor, and
# the agent that drains what this watcher files.
#
# ─────────────────────────────────────────────────────────────────────────────
# SCOPE IS TWO GATES, BOTH REQUIRED
#   1. REPO_ALLOWLIST below (operator-controlled scope), AND
#   2. the repo's own .maintainer.yaml sets `goUpdate.autoUpdate: true`.
# Absent file, absent section, and absent key all read as false. That is a trust
# gate, so a freshly deployed watcher matches ZERO repos until the flag has been
# seeded — an empty first run is correct behaviour, not a fault.
# ─────────────────────────────────────────────────────────────────────────────
#
# ─────────────────────────────────────────────────────────────────────────────
# VALUES CONTRACT
#   * This file carries the unit-INVARIANT defaults.
#   * The per-cluster VARIABLE bits are left empty/placeholder below and MUST be
#     supplied by the cluster's values overlay (or --set), marked `# PER-CLUSTER`.
# ─────────────────────────────────────────────────────────────────────────────

# PER-CLUSTER — target namespace. Required (no default; the cluster owns it).
namespace: ""

# PER-CLUSTER — stage label ("dev"/"prod"). Falls back to `namespace` when empty.
stage: ""

image:
  # PER-CLUSTER — registry host. Empty default forces the overlay to set it.
  registry: ""
  pullPolicy: IfNotPresent
  # PER-CLUSTER — private-registry pull secret(s), e.g. [{name: docker}].
  pullSecrets: []

# PER-CLUSTER — node affinity passthrough (quant pins pods to node_type=<stage>).
affinity: {}

# PER-CLUSTER — extra pod annotation to force a rollout (value of RANDOM).
rolloutNonce: ""

# ── Watcher (unit-invariant defaults) ───────────────────────────────────────
watcher:
  enabled: true
  name: github-vuln-watcher
  image: bborbe/github-vuln-watcher
  # tag: empty => Chart.appVersion (pinned semver; no Keel).
  # Named for the AGENT, not this watcher, and that is deliberate: the Secret
  # already exists in-cluster with the PEM for the same GitHub App, so the
  # watcher reuses it rather than duplicating a PEM. There is no Secret called
  # `github-vuln-watcher` — defaulting to that name would leave an
  # unoverridden install hanging on a missing PEM_KEY.
  existingSecret: github-update-go-agent
  logLevel: "2"
  storage:
    # Holds cursor.json only — the per-repo map of already-reported finding
    # sets. Losing it costs one redundant scan, never correctness: a corrupt
    # file is renamed to cursor.json.corrupt and the cycle cold-starts, and the
    # emitted task_identifier is a deterministic UUID5 so downstream dedup
    # absorbs the repeat.
    size: 100Mi
    # PER-CLUSTER — storageClassName; empty => cluster default StorageClass.
    storageClassName: ""
  # Clone + full vuln gate (make vulncheck + make check) runs IN-POD per repo
  # under a 20-minute timeout; the 200m/100Mi default is too small. The
  # github-update-go-agent image (which runs the same gates) uses 512Mi+
  # requests / 1Gi limits.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    # Persisted-memory path. Must sit on the PVC above, not the container fs,
    # or every restart re-files the whole fleet.
    CURSOR_PATH: /data/cursor.json
    # Detection latency target is <= 24h (SC2); the gate run is minutes per
    # repo, so daily-ish beats the Layer-2 10m cadence.
    POLL_INTERVAL: 12h
    # PER-CLUSTER — fill these from the cluster overlay:
    # OWNER: ""             # GitHub owner / org to scan, e.g. bborbe
    # APP_ID: ""            # GitHub App id
    # INSTALLATION_ID: ""   # GitHub App installation id
    # REPO_ALLOWLIST: ""    # gate 1 of 2 — repos this unit may act on
    # KAFKA_BROKERS: ""     # e.g. my-cluster-kafka-bootstrap.strimzi:9092
    # TOPIC_PREFIX: ""      # e.g. develop / master
    # STAGE: ""             # dev / prod — stamped on every emitted task
    # SENTRY_PROXY: ""      # e.g. http://sentry-proxy.<ns>.svc.cluster.local:9090
