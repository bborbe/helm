# sentry-alert-consumer values.
#
# APPLICATION chart. Ships ONE stateless Deployment (sentry-alert-consumer):
# Kafka consumer → CreateTaskCommand emitter for the sentry-issue-analyzer
# pipeline. No PVC, no GitHub App. One OPTIONAL secret: SENTRY_API_TOKEN, for the
# per-event enrichment lookup (see consumer.secretEnv below). Omit it and the
# consumer publishes derived-key tasks exactly as before.
#
# ─────────────────────────────────────────────────────────────────────────────
# VALUES CONTRACT
#   * This file carries the unit-INVARIANT defaults.
#   * The per-cluster VARIABLE bits are left empty/placeholder below and MUST be
#     supplied by the cluster's values overlay (or --set), marked `# PER-CLUSTER`.
# ─────────────────────────────────────────────────────────────────────────────

# PER-CLUSTER — target namespace. Required (no default; the cluster owns it).
namespace: ""

# PER-CLUSTER — stage label ("dev"/"prod"). Falls back to `namespace` when empty.
stage: ""

image:
  # PER-CLUSTER — registry host. Empty default forces the overlay to set it.
  registry: ""
  pullPolicy: IfNotPresent
  # PER-CLUSTER — private-registry pull secret(s), e.g. [{name: docker}].
  pullSecrets: []

# PER-CLUSTER — node affinity passthrough (nuke pins pods to node_type=<stage>).
affinity: {}

# PER-CLUSTER — extra pod annotation to force a rollout (value of RANDOM).
rolloutNonce: ""

# ── Consumer (unit-invariant defaults) ───────────────────────────────────────
consumer:
  enabled: true
  name: sentry-alert-consumer
  image: bborbe/sentry-alert-consumer
  # tag: empty => Chart.appVersion (pinned semver; no Keel).
  logLevel: "2"
  replicas: 1
  # PER-CLUSTER — Kafka bootstrap NodePort list (e.g. the shared quant Kafka's
  # external listener). Required in the overlay; empty here only so the CI
  # smoke render (which sets stage/namespace/registry) still renders.
  kafkaBrokers: ""
  env:
    # PER-CLUSTER — alert topic ({branch}-raw-sentry-alert-input).
    KAFKA_TOPIC: ""
    # PER-CLUSTER — CQRS command-topic prefix ("develop"/"master").
    TOPIC_PREFIX: ""
    STAGE: ""
    LISTEN: :9090
    TARGET_VAULT: personal
    TASK_ASSIGNEE: sentry-analyzer-agent
    TASK_STATUS: in_progress
    TASK_PHASE: planning

  # PER-CLUSTER — secret-backed env vars, rendered as valueFrom.secretKeyRef.
  # Each entry: {name: <env var>, secretName: <k8s Secret>, key: <Secret key>}.
  #
  # Prefer this over envFrom. secret/sentry-analyzer-agent also holds
  # ANTHROPIC_AUTH_TOKEN, PEM_KEY and SENTRY_DSN, none of which this container
  # needs — envFrom grants a whole secret, secretEnv grants one key.
  #
  # SENTRY_API_TOKEN is what the enrichment lookup needs
  # (GET /api/0/organizations/{org}/eventids/{event_id}/, scope org:read).
  # Omit the entry and enrichment is disabled: the consumer still emits every
  # task with its derived key, so the token is not a hard dependency.
  secretEnv: []
