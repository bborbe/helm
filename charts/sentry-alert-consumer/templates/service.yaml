{{- if .Values.consumer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.consumer.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.consumer.name }}
spec:
  selector:
    app: {{ .Values.consumer.name }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- end }}
