# github-dark-factory values.
#
# APPLICATION chart. Ships ONE GitHub watcher StatefulSet + ONE agent Config CR,
# rendered through the `common` library chart.
#
# PREREQUISITE: install the core `agent` chart FIRST. It owns the
# configs.agent.benjamin-borbe.de CRD (plus the task controller + executor).
# This chart emits a Config CR of that kind but does NOT ship the CRD.
#
# ─────────────────────────────────────────────────────────────────────────────
# VALUES CONTRACT
#   * This file carries the unit-INVARIANT defaults — the bits that are the same
#     no matter which cluster/stage the unit runs on.
#   * The per-cluster VARIABLE bits are left empty/placeholder below and MUST be
#     supplied by the cluster's values overlay (or --set). They are called out
#     inline with `# PER-CLUSTER`.
# ─────────────────────────────────────────────────────────────────────────────

# PER-CLUSTER — target namespace. Required (no default; the cluster owns it).
namespace: ""

# PER-CLUSTER — stage label ("dev"/"prod"). Used to name the cluster-scoped
# PriorityClass uniquely (<stage>-<agent name>) so dev + prod on one cluster
# don't collide. Falls back to `namespace` when empty.
stage: ""

image:
  # PER-CLUSTER — registry host. Empty default forces the overlay to set it
  # (e.g. docker.io for public, docker.quant.benjamin-borbe.de:443 for quant).
  registry: ""
  pullPolicy: IfNotPresent
  # PER-CLUSTER — private-registry pull secret(s), e.g. [{name: docker}].
  pullSecrets: []

# PER-CLUSTER — node affinity passthrough (quant pins pods to node_type=agent).
# Empty = no affinity (generic clusters).
affinity: {}

# PER-CLUSTER — extra pod annotation to force a rollout (value of RANDOM).
# Empty = omit.
rolloutNonce: ""

# ── Watcher (unit-invariant defaults) ───────────────────────────────────────
watcher:
  enabled: true
  name: github-dark-factory-watcher
  image: bborbe/github-dark-factory-watcher
  # tag: empty => Chart.appVersion (pinned semver; no Keel).
  # Existing Secret (by name) holding key PEM_KEY (GitHub App private key).
  # The chart NEVER creates this secret — provision it out of band.
  existingSecret: github-dark-factory-watcher
  storage:
    size: 100Mi
    # PER-CLUSTER — storageClassName; empty => cluster default StorageClass.
    storageClassName: ""
  env:
    POLL_INTERVAL: "5m"
    # PER-CLUSTER — fill these from the cluster overlay:
    # APP_ID: ""            # GitHub App id
    # INSTALLATION_ID: ""   # GitHub App installation id
    # REPO_ALLOWLIST: ""    # repos this unit may act on
    # KAFKA_BROKERS: ""     # e.g. my-cluster-kafka-bootstrap.strimzi:9092
    # TOPIC_PREFIX: ""      # e.g. develop / master

# ── Agent (unit-invariant defaults) ─────────────────────────────────────────
agent:
  enabled: true
  name: github-dark-factory-agent
  assignee: github-dark-factory-agent
  image: bborbe/github-dark-factory-agent
  # tag: empty => Chart.appVersion.
  # Existing Secret (by name) -> Config.spec.secretName. Never created here.
  existingSecret: github-dark-factory-agent
  taskTypes:
    - dark-factory-implement
    - healthcheck
  triggerPhases:
    - planning
    - execution
    - ai_review
  triggerStatuses:
    - in_progress
  heartbeat: 5m
  concurrency: 1
  # Dispatcher-side gate, matches the 1-pod quota. Decision 2026-08-17 (see
  # [[Deploy agent-task-executor v0.5.1 and Set maxConcurrentJobs]]): all agents
  # capped at 1 after the 2026-08-14 bulk-enqueue outage.
  maxConcurrentJobs: 1
  # Job activeDeadlineSeconds (executor zombieJobTimeoutSeconds), raised from the
  # 1800s default to 5400s (90m) 2026-08-21: real multi-prompt implementer runs
  # (generation ~7m + per-prompt execute 10-15m + fix loops) exceed 30m and were
  # killed mid-execution. Matches the agent's own lifecycleTimeout 90m default.
  zombieJobTimeoutSeconds: 5400
  priorityValue: 500
  # Heavier than a pr-reviewer (which is review-only): the implementer runs FOUR
  # sequential claude sessions (generate → execute → verify → ai_review), each a
  # long claude-yolo Node.js process doing tool calls + git between LLM round
  # trips. 500m (half a core) throttled that local work; give it real cores. The
  # dominant cost is still the remote LLM latency, but this removes the local
  # compounder.
  # Memory: the generated prompt's validation step (`make precommit` — go
  # build/test/golangci-lint/trivy/gosec) runs INSIDE the agent's claude-yolo
  # container alongside the claude Node.js process + the dark-factory daemon. At
  # 2Gi that OOM-killed the pod mid-precommit (~12 min), which the executor
  # surfaced as the mislabeled `deadline_exceeded` (BackoffLimitExceeded → that
  # reason enum, spec 043). 6Gi gives the Go toolchain headroom.
  # ephemeral-storage: `make precommit` (go build cache + `go mod download` +
  # trivy vuln DB) blew past 5Gi → the pod was EVICTED (exit 137,
  # ContainerStatusUnknown, at only ~1.4Gi mem — not OOM). Give the Go toolchain
  # real scratch space. Memory 6Gi (mem is not the bottleneck; ~1.4Gi observed).
  resources:
    requests:
      cpu: 1000m
      memory: 3Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: 2000m
      memory: 6Gi
      ephemeral-storage: 25Gi
  env:
    CLAUDE_CONFIG_DIR: /home/node/.claude
    ANTHROPIC_BASE_URL: https://api.minimax.io/anthropic
    ANTHROPIC_MODEL: MiniMax-M2.7-highspeed
    # Bare-clone cache + worktree roots. The executor's Job pod runs as `node`
    # (uid 1000) on a writable rootfs with NO fsGroup, so the defaults `/repos`
    # and `/work` (root-owned container root) fail with `mkdir: permission
    # denied`. Point them under node-owned $HOME instead. Ephemeral per Job pod
    # (no persistent cache yet — that needs the executor to set fsGroup=1000 on
    # the Job pod so a mounted PVC is writable; tracked follow-up).
    REPOS_PATH: /home/node/.cache/github-dark-factory-agent/repos
    WORK_PATH: /home/node/.cache/github-dark-factory-agent/work
    # The ai_review step chdir's into the agent config dir to invoke claude. The
    # default `agent` is RELATIVE and only resolves in local `cmd/run-task` (cwd =
    # repo root, which has an `agent/` subdir). In the image the config is baked at
    # `/agent` (Dockerfile `COPY agent/ /agent/`), so it must be absolute here —
    # else ai_review fails with `chdir agent: no such file or directory`.
    AGENT_DIR: /agent
    # Git commit author/committer identity. dark-factory's per-prompt `git commit`
    # needs a user.name/user.email; the docker backend gets it from the mounted
    # ~/.claude-yolo/.gitconfig, but backend:local has no mount (and
    # `gh auth setup-git` only installs the push credential helper, not the
    # identity) → commit fails with "Author identity unknown". git honors these
    # env vars over config, so set them here.
    GIT_AUTHOR_NAME: github-dark-factory-agent
    GIT_AUTHOR_EMAIL: github-dark-factory-agent@users.noreply.github.com
    GIT_COMMITTER_NAME: github-dark-factory-agent
    GIT_COMMITTER_EMAIL: github-dark-factory-agent@users.noreply.github.com
    # PER-CLUSTER — fill these from the cluster overlay:
    # APP_ID: ""
    # INSTALLATION_ID: ""
    # REPO_ALLOWLIST: ""
    # TOPIC_PREFIX: ""
